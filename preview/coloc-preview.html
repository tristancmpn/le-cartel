<title>Le Cartel</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app iPhone une colonne, cartes blanches arrondies sur fond chaud (esprit Flatastic), logo Le Cartel en tête, onglets en bas */
:root{
  --bg:#F6F3EE; --surface:#FFFFFF; --soft:#F1EDE6; --fg:#1E2421; --muted:#7A817C; --line:#EDE8E0;
  --accent:#3B8358; --accent-fg:#FFFFFF; --accent-soft:#E4EEE7;
  --warm:#B06A3B; --warm-soft:#F3E7DC; --ok:#3B8358; --late:#A8563A; --late-bg:#F3E3DA;
  --shadow:0 1px 2px rgba(60,40,10,.05),0 6px 18px rgba(60,40,10,.06);
  --m1:#3F78C9; --m2:#E0A033; --m3:#D2577A; --m4:#3B8358; --m5:#7A63C9; --m6:#6B7A80;
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:9px; color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:7px;padding:11px 13px}
.num{font-variant-numeric:tabular-nums;font-weight:600}

.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:26px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 4px}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{flex:none;width:96px;height:auto;color:var(--fg)}
.brand .grow{flex:1;min-width:0}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-inline:2px}
.sec-h h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0}
.link{color:var(--accent);font-weight:700;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:13px}

.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);min-height:64px}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:700}
.row .sub{font-size:13px;color:var(--muted);margin-top:2px}
.row.tap{text-align:left;width:100%}

.plus{flex:none;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px 0 13px;border-radius:7px;background:var(--accent);color:var(--accent-fg);font-size:14px;font-weight:700;transition:transform .08s}
.plus::before{content:"";width:11px;height:6px;border-left:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:translateY(-2px) rotate(-45deg)}
.plus:active{transform:scale(.95)}
.btn{flex:none;height:38px;padding:0 15px;border-radius:7px;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--surface)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.full{width:100%;height:50px;font-size:15px;border-radius:9px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--soft);box-shadow:inset 0 0 0 2px var(--c,var(--line))}
.av.sm{width:24px;height:24px;font-size:12px;box-shadow:inset 0 0 0 1.5px var(--c,var(--line))}
.stack{display:flex}.stack .av{margin-left:-7px;outline:2px solid var(--surface)}.stack .av:first-child{margin-left:0}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:5px;background:var(--soft);color:var(--muted)}
.chip.late{background:var(--late-bg);color:var(--late)}
.chip.ok{background:var(--accent-soft);color:var(--ok)}
.chip.free{background:var(--warm-soft);color:var(--warm)}

.wcard{padding:16px;border-top:1px solid var(--line)}
.wcard:first-child{border-top:0}
.wcard .head{display:flex;align-items:flex-start;gap:12px}
.wcard .title{font-weight:700}
.wcard.done .title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.summary div{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 12px}
.summary div:first-child b{color:var(--warm)}
.summary div:last-child b{color:var(--accent)}
.summary b{display:block;font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.summary span{font-size:12px;font-weight:500;color:var(--muted)}

.seg{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1.5px solid var(--line)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;font-size:14px;font-weight:700;padding:9px 11px 10px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1.5px}
.seg button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pager button{width:38px;height:38px;border-radius:7px;background:var(--surface);box-shadow:var(--shadow);font-size:18px;font-weight:700}
.pager button:disabled{opacity:.35;cursor:default}
.pager .lbl{font-size:16px;font-weight:700;text-align:center}

.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:12px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th:first-child,td:first-child{padding-left:16px;text-align:left}
th:last-child,td:last-child{padding-right:16px}
thead th{border-top:0;font-size:12px;font-weight:700;color:var(--muted)}
td.tot{font-weight:800}
td .who{display:flex;align-items:center;gap:8px;font-weight:600}
tr.me td{background:var(--accent-soft)}
td.zero{color:var(--muted)}

.feed .row{min-height:52px;padding-block:11px}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav-in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:relative}
.badge[data-n]::after{content:attr(data-n);position:absolute;top:-4px;right:-9px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--warm);color:var(--surface);font-size:10px;font-weight:800;display:grid;place-items:center}

.scrim{position:fixed;inset:0;background:rgba(20,16,10,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:88%;overflow-y:auto;border-radius:14px 14px 0 0;padding-inline:16px;padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;animation:up .22s ease-out}
.grip{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.plus{transition:none}}

.check{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;font-weight:600}
.check:first-child{border-top:0}
.check input{width:21px;height:21px;accent-color:var(--accent);margin:0}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0}

.tog{position:relative;flex:none;width:50px;height:30px;border-radius:99px;background:var(--line);transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.tog[aria-checked="true"]{background:var(--accent)}
.tog[aria-checked="true"]::after{transform:translateX(20px)}
.tog[disabled]{opacity:.55;cursor:default}
.ex{font-size:12px;font-weight:500;color:var(--muted);margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--soft)}

.picks{display:flex;flex-wrap:wrap;gap:8px}
.picks button{width:42px;height:42px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);font-size:20px}
.picks button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.swatch{background:var(--c)!important;border-radius:50%!important}

.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who-grid button{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 10px;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);font-weight:700}
.who-grid .av{width:56px;height:56px;font-size:28px;box-shadow:inset 0 0 0 3px var(--c)}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);border-radius:9px;padding:12px 16px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:600;width:calc(100% - 32px);max-width:428px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
.toast .grow{flex:1;min-width:0}
.toast button{font-weight:800;color:var(--bg);text-decoration:underline;text-underline-offset:3px}
.note{font-size:13px;font-weight:500;color:var(--muted);background:var(--soft);border-radius:7px;padding:11px 13px}
</style>

<div id="app" class="app"></div>
<nav class="nav" aria-label="Sections"><div class="nav-in" id="nav"></div></nav>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
// ---------- Données d'exemple (preview uniquement) ----------
const NOW = new Date();
const DAY = 864e5;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = rng(41);

const S = {
  me: 't',
  tab: 'home',
  period: 'semaine', off: 0,
  sheet: null,
  members: [
    {id:'t', name:'Tristan', emoji:'🦊', color:'--m1'},
    {id:'l', name:'Hugo',    emoji:'🐢', color:'--m2'},
    {id:'h', name:'Louis',   emoji:'🐙', color:'--m3'},
    {id:'i', name:'Max',     emoji:'🌵', color:'--m4'},
  ],
  daily: [
    {id:'lv', name:'Vider le lave-vaisselle', short:'Lave-v.'},
    {id:'bc', name:'Balai cuisine',           short:'Balai'},
    {id:'pb', name:'Sortir les poubelles',    short:'Poubelles'},
  ],
  catalogue: ['Aspirateur appart','Salle de bain','Serpillère','Four','Frigo','Plaques + hotte'],
  logs: [],        // {id, task, by, ts}
  weekHist: [],    // grosses tâches des semaines passées {name, by:[], ts}
  week: [],        // grosses tâches de la semaine courante
  notif: {mine:true, mineHour:'18:00', mineFreq:'jour', monday:true, midweek:true, midDay:'mercredi', stolen:true, sunday:true, open:true},
};
let uid = 1; const nid = () => 'x' + (uid++);

function sod(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function sow(d){const x=sod(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}

(function seed(){
  const w = {lv:[.32,.22,.28,.18], bc:[.2,.35,.15,.3], pb:[.28,.22,.3,.2]};
  const pick = ws => {let r=rand(),a=0;for(let k=0;k<4;k++){a+=ws[k];if(r<a)return S.members[k].id}return S.members[3].id};
  for(let d=420; d>=0; d--){
    const day = sod(addDays(NOW,-d));
    const n = {lv:(rand()<.85)+(rand()<.3), bc:+(rand()<.6), pb:+(rand()<.45)};
    for(const t in n) for(let k=0;k<n[t];k++){
      const ts = new Date(+day + (8 + rand()*14) * 36e5);
      if(ts < NOW) S.logs.push({id:nid(), task:t, by:pick(w[t]), ts});
    }
  }
  const ws = sow(NOW);
  for(let k=1;k<=56;k++){
    const start = addDays(ws,-7*k);
    const names = S.catalogue.filter(()=>rand()<.75);
    for(const name of names){
      const by=[S.members[Math.floor(rand()*4)].id];
      if(rand()<.15){const o=S.members[Math.floor(rand()*4)].id; if(o!==by[0]) by.push(o)}
      S.weekHist.push({name, by, ts:new Date(+start + rand()*6.9*DAY)});
    }
  }
  const doneTs = new Date(Math.min(+addDays(ws,3) + 19*36e5, +NOW - 36e5));
  S.week = [
    {id:nid(), name:'Salle de bain',     members:['t'],     done:null},
    {id:nid(), name:'Plaques + hotte',   members:['i','t'], done:null},
    {id:nid(), name:'Aspirateur appart', members:['l'],     done:null},
    {id:nid(), name:'Frigo',             members:[],        done:null, late:true},
    {id:nid(), name:'Four',              members:[],        done:null},
    {id:nid(), name:'Serpillère',        members:['h'],     done:{by:['h'], ts:doneTs}},
  ];
})();

// ---------- Utilitaires ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M = id => S.members.find(m => m.id === id);
const T = id => S.daily.find(t => t.id === id);
const me = () => M(S.me);
const av = (id, sm) => {const m=M(id);return `<span class="av${sm?' sm':''}" style="--c:var(${m.color})" title="${esc(m.name)}" aria-hidden="true">${m.emoji}</span>`};
const names = ids => ids.map(i => M(i).name).join(' et ');
const fmtDay = d => d.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'});
const fmtShort = d => d.toLocaleDateString('fr-FR',{day:'numeric', month:'short'});
const hm = d => d.toLocaleTimeString('fr-FR',{hour:'2-digit', minute:'2-digit'});
function ago(d){
  const m = Math.round((NOW - d)/6e4);
  if(m < 1) return "à l'instant";
  if(m < 60) return `il y a ${m} min`;
  const h = Math.round(m/60);
  if(sod(d).getTime() === sod(NOW).getTime()) return `il y a ${h} h`;
  if(sod(d).getTime() === sod(addDays(NOW,-1)).getTime()) return `hier à ${hm(d)}`;
  return `${d.toLocaleDateString('fr-FR',{weekday:'long'})} à ${hm(d)}`;
}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/DAY+1)/7)}
function weekLabel(s){const e=addDays(s,6);return `Semaine ${isoWeek(s)} · ${s.getDate()}${s.getMonth()!==e.getMonth()?' '+fmtShort(s).split(' ')[1]:''} – ${fmtShort(e)}`}

function range(p, off){
  const y=NOW.getFullYear(), mo=NOW.getMonth();
  if(p==='jour'){const s=addDays(sod(NOW),off);const l=off===0?"Aujourd'hui":off===-1?'Hier':fmtDay(s);return {s,e:addDays(s,1),label:l}}
  if(p==='semaine'){const s=addDays(sow(NOW),7*off);return {s,e:addDays(s,7),label:weekLabel(s)}}
  if(p==='mois'){const s=new Date(y,mo+off,1);return {s,e:new Date(y,mo+off+1,1),label:s.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}}
  if(p==='annee'){const s=new Date(y+off,0,1);return {s,e:new Date(y+off+1,0,1),label:String(y+off)}}
  return {s:new Date(0), e:new Date(8.64e15), label:'Depuis le début'};
}
const inR = (ts, r) => ts >= r.s && ts < r.e;

const LOGO = (()=>{
  const bottle = (cx,h) => `<path d="M${cx-5} 163V${163-h+10}q0-5 3-7V${163-h}h4v3q3 2 3 7V163z" fill="currentColor"/>`;
  return `<svg viewBox="0 0 200 170" role="img" aria-label="Le Cartel, 10|04">
    <path d="M100 5L195 165H5Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="miter"/>
    <line x1="88" y1="47" x2="112" y2="47" stroke="currentColor" stroke-width="1.2"/>
    <text x="100" y="67" text-anchor="middle" font-family="Bodoni Moda, Didot, Georgia, serif" font-size="19" letter-spacing="5" fill="currentColor">LE</text>
    <rect x="8" y="73" width="184" height="34" style="fill:var(--bg)"/>
    <text x="100" y="102" text-anchor="middle" font-family="Bodoni Moda, Didot, Georgia, serif" font-weight="500" fill="currentColor" textLength="180" lengthAdjust="spacingAndGlyphs"><tspan font-size="40">C</tspan><tspan font-size="31">ARTE</tspan><tspan font-size="40">L</tspan></text>
    <line x1="58" y1="113" x2="94" y2="113" stroke="currentColor" stroke-width="1.2"/><line x1="106" y1="113" x2="142" y2="113" stroke="currentColor" stroke-width="1.2"/>
    <path d="M100 109l4 4-4 4-4-4z" fill="currentColor"/>
    <text x="100" y="133" text-anchor="middle" font-family="Bodoni Moda, Didot, Georgia, serif" font-size="13" letter-spacing="2" fill="currentColor">10|04</text>
    ${bottle(87,22)}${bottle(100,27)}${bottle(113,22)}
  </svg>`;
})();

// ---------- Icônes ----------
const IC = {
  home:'<svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>',
  daily:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>',
  week:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M8.5 14.5l2 2 4-4"/></svg>',
  stats:'<svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h16M4 20h16M10 5v15"/></svg>',
  set:'<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
};
const TABS = [['home','Accueil'],['daily','Quotidien'],['week','Semaine'],['stats','Stats'],['set','Réglages']];

// ---------- Vues ----------
function vHome(){
  const mine = S.week.filter(w => !w.done && w.members.includes(S.me));
  const free = S.week.filter(w => !w.done && !w.members.length);
  const done = S.week.filter(w => w.done).length;
  const recent = [...S.logs].sort((a,b)=>b.ts-a.ts).slice(0,5);
  return `
  <header class="brand">${LOGO}<div class="grow"><p class="eyebrow">${esc(fmtDay(NOW))}</p><h1>Salut ${esc(me().name)}</h1></div>
    <button data-a="who" aria-label="Changer d'utilisateur">${av(S.me)}</button></header>

  <section class="sec">
    <div class="sec-h"><h2>Mes tâches de la semaine</h2><button class="link" data-a="tab:week">Tout voir</button></div>
    <div class="list">${mine.length ? mine.map(w=>`
      <div class="row"><div class="grow"><div class="title">${esc(w.name)}</div>
        <div class="sub">${w.late?'<span class="chip late">En retard</span> ':''}${w.members.length>1?'Avec '+esc(names(w.members.filter(x=>x!==S.me))):'Seul'}</div></div>
        <button class="btn pri" data-a="wDone:${w.id}">C'est fait</button></div>`).join('')
      : `<div class="row"><div class="grow muted">Rien de prévu pour toi. ${free.length?'Il reste des tâches à prendre.':''}</div></div>`}
    </div>
  </section>

  <div class="summary">
    <div><b>${free.length}</b><span>pas encore prises</span></div>
    <div><b>${S.week.length-done-free.length}</b><span>en cours</span></div>
    <div><b>${done}/${S.week.length}</b><span>faites</span></div>
  </div>

  <section class="sec">
    <div class="sec-h"><h2>Quotidien</h2><button class="link" data-a="tab:daily">Détails</button></div>
    <div class="list">${S.daily.map(rowDaily).join('')}</div>
  </section>

  <section class="sec feed">
    <div class="sec-h"><h2>Activité récente</h2></div>
    <div class="list">${recent.map(l=>`
      <div class="row">${av(l.by,1)}<div class="grow small"><b>${esc(M(l.by).name)}</b> · ${esc(T(l.task)?.name||'Tâche supprimée')}</div><span class="small muted">${ago(l.ts)}</span></div>`).join('')}
    </div>
  </section>`;
}

function rowDaily(t){
  const last = S.logs.filter(l=>l.task===t.id).reduce((a,b)=>!a||b.ts>a.ts?b:a, null);
  const wk = range('semaine',0);
  const mine = S.logs.filter(l=>l.task===t.id && l.by===S.me && inR(l.ts,wk)).length;
  return `<div class="row">
    <button class="grow tap" data-a="openTask:${t.id}" style="text-align:left">
      <div class="title">${esc(t.name)}</div>
      <div class="sub">${last?`${esc(M(last.by).name)}, ${ago(last.ts)}`:'Jamais faite'} · moi <span class="num">${mine}</span> cette sem.</div>
    </button>
    <button class="plus" data-a="plus:${t.id}" aria-label="J'ai fait : ${esc(t.name)}">Fait</button>
  </div>`;
}

function vDaily(){
  return `
  <header class="top"><div><p class="eyebrow">Pas nominatif, chacun note ce qu'il fait</p><h1>Quotidien</h1></div></header>
  <section class="sec">
    <div class="list">${S.daily.map(rowDaily).join('')}</div>
    <p class="small muted">Touche le nom d'une tâche pour voir qui l'a faite et corriger un oubli.</p>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Cette semaine, toutes tâches</h2></div>
    ${tableDaily(range('semaine',0), true)}
  </section>
  <button class="btn full" data-a="sheet:manageDaily">Ajouter ou supprimer des tâches</button>`;
}

function wCard(w){
  const inMe = w.members.includes(S.me);
  let status, acts = '';
  if(w.done){
    status = `<span class="chip ok">Faite par ${esc(names(w.done.by))} · ${w.done.ts.toLocaleDateString('fr-FR',{weekday:'short'})}</span>`;
    if(w.done.by.includes(S.me)) acts = `<button class="btn ghost" data-a="wUndo:${w.id}">Annuler</button>`;
  } else if(!w.members.length){
    status = `<span class="chip free">Personne</span>`;
    acts = `<button class="btn pri" data-a="wTake:${w.id}">Je prends</button>`;
  } else if(inMe){
    status = `<span class="chip">${w.members.length>1?'Toi et '+esc(names(w.members.filter(x=>x!==S.me))):'Toi'}</span>`;
    acts = `<button class="btn pri" data-a="wDone:${w.id}">C'est fait</button><button class="btn" data-a="wLeave:${w.id}">Me retirer</button>`;
  } else {
    status = `<span class="chip">${esc(names(w.members))}</span>`;
    acts = `<button class="btn" data-a="wJoin:${w.id}">Rejoindre</button><button class="btn" data-a="wSteal:${w.id}">Reprendre</button><button class="btn" data-a="wSteal2:${w.id}">Je l'ai faite</button>`;
  }
  const people = w.done ? w.done.by : w.members;
  return `<div class="wcard${w.done?' done':''}">
    <div class="head"><div class="grow" style="flex:1;min-width:0">
      <div class="title">${esc(w.name)}</div>
      <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">${w.late?'<span class="chip late">Reportée de la sem. dernière</span>':''}${status}</div>
    </div>${people.length?`<div class="stack">${people.map(p=>av(p)).join('')}</div>`:''}</div>
    ${acts?`<div class="actions">${acts}</div>`:''}
  </div>`;
}

function vWeek(){
  const order = w => w.done ? 3 : !w.members.length ? 0 : w.members.includes(S.me) ? 1 : 2;
  const sorted = [...S.week].sort((a,b)=>order(a)-order(b));
  return `
  <header class="top"><div><p class="eyebrow">${esc(weekLabel(sow(NOW)))}</p><h1>Grosses tâches</h1></div></header>
  <section class="sec"><div class="list">${sorted.map(wCard).join('')}</div></section>
  <button class="btn full pri" data-a="sheet:addWeek">Ajouter des tâches à la semaine</button>
  <p class="note">Les tâches pas faites dimanche soir passent à la semaine suivante avec la mention « reportée ».</p>`;
}

function seg(){
  const P = [['jour','Jour'],['semaine','Semaine'],['last','Sem. passée'],['mois','Mois'],['annee','Année'],['tout','Tout']];
  const cur = S.period==='semaine' && S.off===-1 ? 'last' : S.period;
  const r = range(S.period, S.off);
  return `<div class="seg" role="group" aria-label="Période">${P.map(([k,l])=>`<button aria-pressed="${cur===k}" data-a="period:${k}">${l}</button>`).join('')}</div>
  ${S.period!=='tout'?`<div class="pager"><button data-a="off:-1" aria-label="Période précédente">‹</button><span class="lbl">${esc(r.label)}</span><button data-a="off:1" aria-label="Période suivante" ${S.off>=0?'disabled':''}>›</button></div>`:''}`;
}

function tableDaily(r, compact){
  const rows = S.members.map(m=>{
    const c = S.daily.map(t=>S.logs.filter(l=>l.by===m.id && l.task===t.id && inR(l.ts,r)).length);
    return {m, c, tot:c.reduce((a,b)=>a+b,0)};
  }).sort((a,b)=>b.tot-a.tot);
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>Coloc</th>${S.daily.map(t=>`<th>${esc(t.short)}</th>`).join('')}<th>Total</th></tr></thead>
    <tbody>${rows.map(x=>`<tr${x.m.id===S.me?' class="me"':''}><td><span class="who">${av(x.m.id,1)}${esc(x.m.name)}</span></td>${x.c.map(v=>`<td class="n${v?'':' zero'}">${v}</td>`).join('')}<td class="n tot">${x.tot}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

function tableWeekly(r){
  const all = [...S.weekHist, ...S.week.filter(w=>w.done).map(w=>({name:w.name, by:w.done.by, ts:w.done.ts}))].filter(h=>inR(h.ts,r));
  const rows = S.members.map(m=>{
    const mine = all.filter(h=>h.by.includes(m.id));
    const top = Object.entries(mine.reduce((o,h)=>(o[h.name]=(o[h.name]||0)+1,o),{})).sort((a,b)=>b[1]-a[1])[0];
    return {m, n:mine.length, top: top ? top[0] : '–'};
  }).sort((a,b)=>b.n-a.n);
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>Coloc</th><th>Faites</th><th>La plus faite</th></tr></thead>
    <tbody>${rows.map(x=>`<tr${x.m.id===S.me?' class="me"':''}><td><span class="who">${av(x.m.id,1)}${esc(x.m.name)}</span></td><td class="n tot${x.n?'':' zero'}">${x.n}</td><td>${esc(x.top)}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

function vStats(){
  const r = range(S.period, S.off);
  return `
  <header class="top"><div><p class="eyebrow">Trié par celui qui en a fait le plus</p><h1>Stats</h1></div></header>
  <div class="sec">${seg()}</div>
  <section class="sec"><div class="sec-h"><h2>Tâches quotidiennes</h2></div>${tableDaily(r)}</section>
  <section class="sec"><div class="sec-h"><h2>Grosses tâches</h2></div>${tableWeekly(r)}</section>`;
}

function tog(key, label, ex, locked){
  return `<div class="row" style="align-items:flex-start"><div class="grow"><div class="title">${label}</div>${ex?`<div class="ex">${ex}</div>`:''}</div>
    <button class="tog" role="switch" aria-checked="${S.notif[key]}" aria-label="${esc(label)}" ${locked?'disabled':`data-a="tog:${key}"`}></button></div>`;
}

function vSet(){
  const m = me();
  const EM = ['🦊','🐢','🐙','🌵','🍋','🐝','🦉','🍄'];
  const CO = ['--m1','--m2','--m3','--m4','--m5','--m6'];
  return `
  <header class="top"><div><p class="eyebrow">Sur ce téléphone</p><h1>Réglages</h1></div></header>

  <section class="sec"><div class="sec-h"><h2>Moi</h2></div>
    <div class="list">
      <div class="row">${av(S.me)}<div class="grow"><div class="title">${esc(m.name)}</div><div class="sub">Ce téléphone est celui de ${esc(m.name)}</div></div><button class="btn" data-a="who">Changer</button></div>
      <div class="row" style="flex-direction:column;align-items:stretch;gap:10px"><span class="small muted">Emoji</span>
        <div class="picks">${EM.map(e=>`<button aria-pressed="${m.emoji===e}" data-a="emoji:${e}">${e}</button>`).join('')}</div>
        <span class="small muted">Couleur</span>
        <div class="picks">${CO.map(c=>`<button class="swatch" style="--c:var(${c})" aria-label="Couleur" aria-pressed="${m.color===c}" data-a="color:${c}"></button>`).join('')}</div>
      </div>
    </div>
  </section>

  <section class="sec"><div class="sec-h"><h2>Rappels</h2></div>
    <div class="list">
      <div class="row" style="flex-direction:column;align-items:stretch;gap:10px">
        <div style="display:flex;gap:12px;align-items:flex-start"><div class="grow" style="flex:1"><div class="title">Ma tâche n'est pas encore faite</div></div>
          <button class="tog" role="switch" aria-checked="${S.notif.mine}" aria-label="Ma tâche n'est pas encore faite" data-a="tog:mine"></button></div>
        ${S.notif.mine?`<div style="display:flex;gap:8px;flex-wrap:wrap">
          <select id="mineFreq" data-c="mineFreq" aria-label="Fréquence">${[['jour','Tous les jours'],['2j','Tous les 2 jours'],['dim','Seulement le dimanche']].map(([v,l])=>`<option value="${v}"${S.notif.mineFreq===v?' selected':''}>${l}</option>`).join('')}</select>
          <select id="mineHour" data-c="mineHour" aria-label="Heure">${['08:00','12:00','18:00','20:00','21:00'].map(h=>`<option${S.notif.mineHour===h?' selected':''}>${h}</option>`).join('')}</select></div>
          <div class="ex">Salle de bain t'attend encore cette semaine.</div>`:''}
      </div>
      ${tog('monday','Lundi : la liste de la semaine est prête','6 grosses tâches cette semaine, choisis les tiennes.')}
      ${tog('midweek','Milieu de semaine : tâches pas prises','Four et Frigo n\'ont encore personne.')}
      ${tog('stolen','Quelqu\'un reprend une de mes tâches','Hugo a repris Aspirateur appart.')}
      ${tog('open','À l\'ouverture de l\'app : mes tâches en attente','Bandeau en haut de l\'accueil.')}
      ${tog('sunday','Dimanche 19h : tâche pas faite','Toujours activé pour tout le monde.', true)}
    </div>
    <p class="note">Sur iPhone, les rappels n'arrivent que si l'app est sur l'écran d'accueil : Safari, bouton Partager, puis « Sur l'écran d'accueil ».</p>
  </section>

  <section class="sec"><div class="sec-h"><h2>Coloc</h2></div>
    <div class="list">
      <button class="row tap" data-a="sheet:manageDaily"><div class="grow"><div class="title">Tâches quotidiennes</div><div class="sub">${S.daily.length} tâches</div></div><span class="muted">›</span></button>
      <button class="row tap" data-a="sheet:manageCat"><div class="grow"><div class="title">Catalogue des grosses tâches</div><div class="sub">${S.catalogue.length} tâches</div></div><span class="muted">›</span></button>
      <div class="row"><div class="grow"><div class="title">Colocataires</div><div class="sub">${esc(S.members.map(x=>x.name).join(', '))}</div></div><div class="stack">${S.members.map(x=>av(x.id,1)).join('')}</div></div>
    </div>
  </section>
  <p class="small muted" style="text-align:center">Maquette : les données sont des exemples.</p>`;
}

// ---------- Feuilles ----------
function shTask(id){
  const t = T(id); const r = range(S.period, S.off);
  const logs = S.logs.filter(l=>l.task===id && inR(l.ts,r)).sort((a,b)=>b.ts-a.ts);
  const per = S.members.map(m=>({m, n:logs.filter(l=>l.by===m.id).length})).sort((a,b)=>b.n-a.n);
  const today = sod(NOW).toISOString().slice(0,10);
  return `<h3>${esc(t.name)}</h3>${seg()}
  <div class="tbl-wrap"><table><thead><tr><th>Coloc</th><th>Fois</th></tr></thead><tbody>
    ${per.map(x=>`<tr${x.m.id===S.me?' class="me"':''}><td><span class="who">${av(x.m.id,1)}${esc(x.m.name)}</span></td><td class="n tot${x.n?'':' zero'}">${x.n}</td></tr>`).join('')}
  </tbody></table></div>
  <section class="sec"><div class="sec-h"><h2>J'ai oublié de noter</h2></div>
    <div class="field"><input type="date" id="pastDate" value="${today}" max="${today}" aria-label="Date"><button class="btn pri" data-a="addPast:${id}" style="height:44px">Ajouter</button></div>
  </section>
  <section class="sec feed"><div class="sec-h"><h2>Journal</h2><span class="small muted">${logs.length} entrées</span></div>
    <div class="list">${logs.slice(0,30).map(l=>`<div class="row">${av(l.by,1)}<div class="grow small"><b>${esc(M(l.by).name)}</b> · ${esc(l.ts.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}))} ${hm(l.ts)}</div>${l.by===S.me?`<button class="btn ghost" data-a="delLog:${l.id}">Supprimer</button>`:''}</div>`).join('') || '<div class="row muted small">Rien sur cette période.</div>'}
    ${logs.length>30?`<div class="row small muted">… et ${logs.length-30} de plus</div>`:''}</div>
  </section>`;
}
function shAddWeek(){
  const present = new Set(S.week.map(w=>w.name));
  const avail = S.catalogue.filter(c=>!present.has(c));
  return `<h3>Ajouter à la semaine</h3>
  <section class="sec"><div class="sec-h"><h2>Catalogue</h2></div>
    <div class="list">${avail.length?avail.map((c,i)=>`<label class="check"><input type="checkbox" id="cat${i}" value="${esc(c)}" data-cat>${esc(c)}</label>`).join(''):'<div class="row muted small">Tout le catalogue est déjà dans la semaine.</div>'}</div>
  </section>
  <section class="sec"><div class="sec-h"><h2>Autre tâche</h2></div>
    <input id="newW" placeholder="Ex. Laver les vitres" aria-label="Nouvelle tâche">
    <label class="check" style="padding:4px 0;border:0"><input type="checkbox" id="saveCat"> L'ajouter aussi au catalogue</label>
  </section>
  <button class="btn pri full" data-a="addWeek">Ajouter</button>`;
}
function shManage(kind){
  const daily = kind==='daily';
  const items = daily ? S.daily.map(t=>({k:t.id, n:t.name})) : S.catalogue.map(c=>({k:c, n:c}));
  return `<h3>${daily?'Tâches quotidiennes':'Catalogue des grosses tâches'}</h3>
  <div class="list">${items.map(x=>`<div class="row"><div class="grow">${esc(x.n)}</div><button class="btn ghost" data-a="${daily?'delDaily':'delCat'}:${esc(x.k)}">Supprimer</button></div>`).join('')}</div>
  <div class="field"><input id="newItem" placeholder="${daily?'Ex. Essuyer la table':'Ex. Laver les vitres'}" aria-label="Nouvelle tâche"><button class="btn pri" style="height:44px" data-a="${daily?'addDaily':'addCat'}">Ajouter</button></div>
  ${daily?'<p class="small muted">Supprimer une tâche garde son historique dans les stats.</p>':''}`;
}
function shWho(){
  return `<h3>Qui utilise ce téléphone ?</h3><p class="small muted" style="margin:-10px 0 0">On ne te le redemandera plus sur cet appareil.</p>
  <div class="who-grid">${S.members.map(m=>`<button data-a="pick:${m.id}">${av(m.id)}${esc(m.name)}</button>`).join('')}</div>`;
}

// ---------- Rendu ----------
function render(){
  const V = {home:vHome, daily:vDaily, week:vWeek, stats:vStats, set:vSet}[S.tab];
  document.getElementById('app').innerHTML = V();
  const pending = S.week.filter(w=>!w.done && !w.members.length).length;
  document.getElementById('nav').innerHTML = TABS.map(([k,l])=>`<button data-a="tab:${k}" ${S.tab===k?'aria-current="page"':''}><span class="badge"${k==='week'&&pending?` data-n="${pending}"`:''}>${IC[k]}</span>${l}</button>`).join('');
  const L = document.getElementById('layer');
  if(!S.sheet){L.innerHTML='';return}
  const [type,arg] = S.sheet;
  const body = type==='task'?shTask(arg):type==='addWeek'?shAddWeek():type==='manageDaily'?shManage('daily'):type==='manageCat'?shManage('cat'):shWho();
  const keep = L.querySelector('.sheet')?.scrollTop || 0;
  L.innerHTML = `<div class="scrim" data-a="close"><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>${body}</div></div>`;
  L.querySelector('.sheet').scrollTop = keep;
}

let toastTimer;
function toast(msg, undo){
  const el = document.getElementById('toast');
  el.innerHTML = `<span class="grow">${msg}</span>${undo?'<button data-a="undo">Annuler</button>':''}`;
  el.hidden = false; S.undo = undo;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{el.hidden=true; S.undo=null}, 5000);
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  if(el.dataset.a==='close' && e.target!==el) return;
  const [a, v] = el.dataset.a.split(/:(.*)/s);
  const W = () => S.week.find(w=>w.id===v);
  switch(a){
    case 'tab': S.tab=v; S.sheet=null; window.scrollTo(0,0); break;
    case 'close': S.sheet=null; break;
    case 'sheet': S.sheet=[v]; break;
    case 'who': S.sheet=['who']; break;
    case 'pick': S.me=v; S.sheet=null; toast(`Ce téléphone est maintenant celui de ${esc(M(v).name)}`); break;
    case 'openTask': S.sheet=['task',v]; break;
    case 'plus': { const l={id:nid(),task:v,by:S.me,ts:new Date()}; S.logs.push(l);
      toast(`Fait : ${esc(T(v).name)}`, ()=>{S.logs=S.logs.filter(x=>x!==l)}); break; }
    case 'undo': if(S.undo){S.undo(); S.undo=null; document.getElementById('toast').hidden=true} break;
    case 'delLog': S.logs=S.logs.filter(l=>l.id!==v); toast('Entrée supprimée'); break;
    case 'addPast': { const d=document.getElementById('pastDate').value; if(!d) return;
      const ts=new Date(d+'T12:00'); if(ts>NOW) ts.setTime(+NOW);
      S.logs.push({id:nid(),task:v,by:S.me,ts}); toast(`Ajouté le ${esc(fmtShort(ts))}`); break; }
    case 'period': if(v==='last'){S.period='semaine';S.off=-1}else{S.period=v;S.off=0} break;
    case 'off': S.off=Math.min(0,S.off+(+v)); break;
    case 'wTake': W().members=[S.me]; toast(`Tu t'occupes de ${esc(W().name)}`); break;
    case 'wJoin': W().members.push(S.me); toast(`Tu as rejoint ${esc(W().name)}`); break;
    case 'wLeave': W().members=W().members.filter(x=>x!==S.me); break;
    case 'wSteal': { const prev=W().members; W().members=[S.me]; toast(`${esc(names(prev))} ${prev.length>1?'ont':'a'} été prévenu`); break; }
    case 'wSteal2': { const prev=W().members; W().members=[S.me]; W().done={by:[S.me],ts:new Date()}; toast(`Validée à ton nom. ${esc(names(prev))} ${prev.length>1?'ont':'a'} été prévenu`); break; }
    case 'wDone': { const w=W(); w.done={by:[...w.members],ts:new Date()}; toast(`${esc(w.name)} : faite`, ()=>{w.done=null}); break; }
    case 'wUndo': W().done=null; break;
    case 'addWeek': {
      const picked=[...document.querySelectorAll('[data-cat]:checked')].map(i=>i.value);
      const n=document.getElementById('newW').value.trim();
      if(n){picked.push(n); if(document.getElementById('saveCat').checked && !S.catalogue.includes(n)) S.catalogue.push(n)}
      if(!picked.length){toast('Coche au moins une tâche'); return}
      picked.forEach(p=>S.week.push({id:nid(),name:p,members:[],done:null}));
      S.sheet=null; toast(`${picked.length} tâche${picked.length>1?'s':''} ajoutée${picked.length>1?'s':''}`); break; }
    case 'addDaily': { const n=document.getElementById('newItem').value.trim(); if(!n) return;
      S.daily.push({id:nid(),name:n,short:n.length>10?n.slice(0,9)+'.':n}); break; }
    case 'delDaily': S.daily=S.daily.filter(t=>t.id!==v); break;
    case 'addCat': { const n=document.getElementById('newItem').value.trim(); if(n && !S.catalogue.includes(n)) S.catalogue.push(n); break; }
    case 'delCat': S.catalogue=S.catalogue.filter(c=>c!==v); break;
    case 'tog': S.notif[v]=!S.notif[v]; break;
    case 'emoji': me().emoji=v; break;
    case 'color': me().color=v; break;
  }
  render();
});
document.addEventListener('change', e=>{ const k=e.target.dataset?.c; if(k){S.notif[k]=e.target.value} });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.sheet){S.sheet=null; render()} });
render();
</script>
